<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - My Online Store</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

    <header>
        <h1>🔐 Admin Dashboard</h1>
        <nav>
            <button class="theme-toggle" onclick="toggleTheme()">🌙 Mode</button>
            <a href="../index.html">View Store</a>
        </nav>
    </header>

    <main class="container">
        <!-- Login Section -->
        <div id="login-section" style="max-width: 400px; margin: 40px auto; background: var(--card-bg); border: 1px solid var(--border-color); padding: 30px; border-radius: 8px;">
            <h2>Admin Login</h2>
            <form id="login-form" style="margin-top: 20px; display: flex; flex-direction: column; gap: 15px;">
                <input type="text" id="admin-user" placeholder="Username" required style="padding: 12px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); border-radius: 5px;">
                <input type="password" id="admin-pass" placeholder="Password" required style="padding: 12px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); border-radius: 5px;">
                <button type="submit" style="padding: 12px; background: #2c3e50; font-size: 16px;">Login</button>
            </form>
        </div>

        <!-- Dashboard Panel (Hidden until logged in) -->
        <div id="dashboard-section" style="display: none;">
            
            <!-- SECTION 1: ADD / EDIT PRODUCTS -->
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-bottom: 40px;">
                
                <!-- Add Product Form -->
                <div style="background: var(--card-bg); border: 1px solid var(--border-color); padding: 25px; border-radius: 8px;">
                    <h3 id="form-heading">Add New Product</h3>
                    <form id="product-form" style="display: flex; flex-direction: column; gap: 12px;">
                        <input type="hidden" id="prod-id">
                        <input type="text" id="prod-title" placeholder="Product Title" required style="padding: 10px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); border-radius: 5px;">
                        <input type="number" step="0.01" id="prod-price" placeholder="Price (GHS)" required style="padding: 10px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); border-radius: 5px;">
                        <input type="number" id="prod-stock" placeholder="Stock Amount Left" required style="padding: 10px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); border-radius: 5px;">
                        <textarea id="prod-desc" placeholder="Product Description" rows="2" required style="padding: 10px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); border-radius: 5px; font-family: inherit;"></textarea>
                        <input type="url" id="prod-image" placeholder="Image URL" required style="padding: 10px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); border-radius: 5px;">
                        <input type="text" id="prod-category" placeholder="Category" required style="padding: 10px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); border-radius: 5px;">
                        <div style="display: flex; gap: 10px;">
                            <button type="submit" id="save-prod-btn" style="background: #27ae60; flex: 1; padding: 10px;">Publish Product</button>
                            <button type="button" id="cancel-edit-btn" onclick="resetProductForm()" style="background: #e74c3c; display:none; padding: 10px;">Cancel</button>
                        </div>
                    </form>
                </div>

                <!-- Update Store Settings (About Us / Contact info) -->
                <div style="background: var(--card-bg); border: 1px solid var(--border-color); padding: 25px; border-radius: 8px;">
                    <h3>Store Settings & Contact Info</h3>
                    <form id="settings-form" style="display: flex; flex-direction: column; gap: 12px;">
                        <label style="font-size: 14px;">Store Name / Title</label>
                        <input type="text" id="set-storename" placeholder="Store Name" style="padding: 10px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); border-radius: 5px;">
                        
                        <label style="font-size: 14px;">About Us Text</label>
                        <textarea id="set-about" placeholder="About your store..." rows="2" style="padding: 10px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); border-radius: 5px; font-family: inherit;"></textarea>
                        
                        <label style="font-size: 14px;">Contact WhatsApp Number</label>
                        <input type="text" id="set-whatsapp" placeholder="+233..." style="padding: 10px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); border-radius: 5px;">
                        
                        <button type="submit" style="background: #3498db; padding: 10px;">Save Settings</button>
                    </form>
                </div>

            </div>

            <!-- SECTION 2: INVENTORY LIST (EDIT / DELETE) -->
            <div style="background: var(--card-bg); border: 1px solid var(--border-color); padding: 25px; border-radius: 8px;">
                <h3>Manage Inventory</h3>
                <div id="admin-product-list" style="overflow-x: auto;"></div>
            </div>

        </div>
    </main>

    <footer>
        <p>&copy; 2026 My Online Store Admin</p>
    </footer>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbz4ESWZEST-Gnl8LzloIVP6uK7FrlhTADNvOczuCJLNBWQF1TooKT8vrE5RNuQFZMQ_8g/exec"; // REPLACE WITH YOUR URL

        // Theme Switcher
        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        }
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
        }

        const loginForm = document.getElementById('login-form');
        const productForm = document.getElementById('product-form');
        const settingsForm = document.getElementById('settings-form');

        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            const username = document.getElementById('admin-user').value;
            const password = document.getElementById('admin-pass').value;

            try {
                let res = await fetch(API_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "adminLogin", username, password })
                });
                let result = await res.json();
                if (result.status === "success") {
                    document.getElementById('login-section').style.display = 'none';
                    document.getElementById('dashboard-section').style.display = 'block';
                    loadAdminProducts();
                    loadAdminSettings();
                } else {
                    alert("Invalid username or password!");
                }
            } catch (err) {
                console.error(err);
                alert("Login failed. Check your API URL.");
            }
        });

        // Load Products into Admin Inventory Table
        async function loadAdminProducts() {
            const container = document.getElementById('admin-product-list');
            try {
                let res = await fetch(`${API_URL}?action=getProducts`);
                let result = await res.json();
                if (result.status === "success") {
                    let products = result.data;
                    if (products.length === 0) {
                        container.innerHTML = "<p>No products found in inventory.</p>";
                        return;
                    }
                    container.innerHTML = `
                        <table style="width:100%; border-collapse: collapse; text-align: left;">
                            <thead>
                                <tr style="border-bottom: 2px solid var(--border-color);">
                                    <th style="padding: 10px;">Title</th>
                                    <th style="padding: 10px;">Price (GHS)</th>
                                    <th style="padding: 10px;">Stock Left</th>
                                    <th style="padding: 10px;">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${products.map(p => `
                                    <tr style="border-bottom: 1px solid var(--border-color);">
                                        <td style="padding: 10px;">${p.title}</td>
                                        <td style="padding: 10px;">${p.price}</td>
                                        <td style="padding: 10px;">${p.stock}</td>
                                        <td style="padding: 10px; display: flex; gap: 10px;">
                                            <button onclick='prepEditProduct(${JSON.stringify(p)})' style="background: #f39c12; padding: 5px 10px; font-size: 12px;">Edit</button>
                                            <button onclick='deleteProduct("${p.id}")' style="background: #e74c3c; padding: 5px 10px; font-size: 12px;">Delete</button>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    `;
                }
            } catch (err) {
                console.error(err);
            }
        }

        // Add or Edit Product Submission
        productForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            const id = document.getElementById('prod-id').value;
            const title = document.getElementById('prod-title').value;
            const price = document.getElementById('prod-price').value;
            const stock = document.getElementById('prod-stock').value;
            const description = document.getElementById('prod-desc').value;
            const imageUrl = document.getElementById('prod-image').value;
            const category = document.getElementById('prod-category').value;

            const action = id ? "editProduct" : "addProduct";

            try {
                let res = await fetch(API_URL, {
                    method: "POST",
                    body: JSON.stringify({ action, id, title, price, stock, description, imageUrl, category })
                });
                let result = await res.json();
                if (result.status === "success") {
                    alert(id ? "Product updated successfully!" : "Product added successfully!");
                    resetProductForm();
                    loadAdminProducts();
                } else {
                    alert("Operation failed: " + result.message);
                }
            } catch (err) {
                console.error(err);
                alert("Error connecting to database.");
            }
        });

        function prepEditProduct(p) {
            document.getElementById('form-heading').innerText = "Edit Product: " + p.title;
            document.getElementById('prod-id').value = p.id;
            document.getElementById('prod-title').value = p.title;
            document.getElementById('prod-price').value = p.price;
            document.getElementById('prod-stock').value = p.stock;
            document.getElementById('prod-desc').value = p.description;
            document.getElementById('prod-image').value = p.imageUrl;
            document.getElementById('prod-category').value = p.category;
            document.getElementById('save-prod-btn').innerText = "Update Product";
            document.getElementById('cancel-edit-btn').style.display = "block";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetProductForm() {
            document.getElementById('form-heading').innerText = "Add New Product";
            productForm.reset();
            document.getElementById('prod-id').value = "";
            document.getElementById('save-prod-btn').innerText = "Publish Product";
            document.getElementById('cancel-edit-btn').style.display = "none";
        }

        async function deleteProduct(id) {
            if (!confirm("Are you sure you want to delete this product?")) return;
            try {
                let res = await fetch(API_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "deleteProduct", id })
                });
                let result = await res.json();
                if (result.status === "success") {
                    alert("Product deleted!");
                    loadAdminProducts();
                } else {
                    alert("Failed to delete.");
                }
            } catch (err) {
                console.error(err);
            }
        }

        // Settings Handling
        settingsForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            const settings = {
                storeName: document.getElementById('set-storename').value,
                aboutUs: document.getElementById('set-about').value,
                whatsapp: document.getElementById('set-whatsapp').value
            };
            try {
                let res = await fetch(API_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "saveSettings", settings })
                });
                let result = await res.json();
                if (result.status === "success") {
                    alert("Settings saved successfully!");
                } else {
                    alert("Failed to save settings.");
                }
            } catch (err) {
                console.error(err);
            }
        });

        async function loadAdminSettings() {
            try {
                let res = await fetch(`${API_URL}?action=getSettings`);
                let result = await res.json();
                if (result.status === "success" && result.data) {
                    let s = result.data;
                    if (s.storeName) document.getElementById('set-storename').value = s.storeName;
                    if (s.aboutUs) document.getElementById('set-about').value = s.aboutUs;
                    if (s.whatsapp) document.getElementById('set-whatsapp').value = s.whatsapp;
                }
            } catch (err) {
                console.error(err);
            }
        }
    </script>
</body>
</html>
